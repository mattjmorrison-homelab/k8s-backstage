apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      serviceAccountName: backstage
      imagePullSecrets:
        - name: backstage-zot-pull-secret
      containers:
        - name: backstage
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: 7007
          env:
            # Plain, non-sensitive config -- goes directly in the manifest,
            # not through OpenBao (only the password itself is a secret).
            - name: POSTGRES_HOST
              value: backstage-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: backstage
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage
                  key: POSTGRES_PASSWORD
            - name: BACKEND_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage
                  key: BACKEND_SECRET
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: backstage
                  key: GITHUB_APP_ID
            - name: AUTH_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backstage
                  key: AUTH_GITHUB_CLIENT_ID
            - name: AUTH_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage
                  key: AUTH_GITHUB_CLIENT_SECRET
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backstage
                  key: GITHUB_APP_PRIVATE_KEY
