apiVersion: batch/v1
kind: Job
metadata:
  name: backstage-bootstrap-secrets
  namespace: backstage
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: backstage-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: "{{ .Values.bootstrap.image.repository }}@{{ .Values.bootstrap.image.digest }}"
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            - name: OPENBAO_ADDR
              value: "http://k8s-openbao.openbao.svc:8200"
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: backstage-bootstrap-secrets-script
            defaultMode: 0555
